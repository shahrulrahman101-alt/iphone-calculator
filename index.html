
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iPhone Scientific Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="calculator">
    <div class="topbar">
        <span>CALCULATOR PRO</span>
        <div>
            <button class="small-btn" id="angleMode">DEG</button>
            <button class="small-btn" id="sciToggle">SCI</button>
        </div>
    </div>

    <div class="display">
        <div id="history"></div>
        <div id="result">0</div>
        <div id="decimalResult"></div>
    </div>

    <div class="scientific" id="sciPanel">
        <button data-action="sin">sin</button><button data-action="cos">cos</button><button data-action="tan">tan</button><button data-action="asin">sin⁻¹</button>
        <button data-action="acos">cos⁻¹</button><button data-action="atan">tan⁻¹</button><button data-action="sinh">sinh</button><button data-action="cosh">cosh</button>
        <button data-action="tanh">tanh</button><button data-action="sqrt">√</button><button data-action="cbrt">∛</button><button data-action="square">x²</button>
        <button data-action="cube">x³</button><button data-action="power">xʸ</button><button data-action="reciprocal">1/x</button><button data-action="factorial">x!</button>
        <button data-action="log">log</button><button data-action="ln">ln</button><button data-action="log2">log₂</button><button data-action="tenpower">10ˣ</button>
        <button data-action="exp">eˣ</button><button data-action="abs">|x|</button><button data-action="floor">⌊x⌋</button><button data-action="ceil">⌈x⌉</button>
        <button data-action="round">round</button><button data-action="mod">mod</button><button data-action="nCr">nCr</button><button data-action="nPr">nPr</button>
        <button data-action="pi">π</button><button data-action="e">e</button><button data-action="ans">Ans</button><button data-action="backspace">⌫</button>
        <button data-action="mc">MC</button><button data-action="mr">MR</button><button data-action="mplus">M+</button><button data-action="mminus">M−</button>
    </div>

        <div class="buttons">
        <button class="function" data-action="clear">AC</button>
        <button class="function" data-action="sign">+/−</button>
        <button class="function" data-action="parenthesis">( )</button>
        <button class="operator" data-op="/">÷</button>

        <button data-number="7">7</button>
        <button data-number="8">8</button>
        <button data-number="9">9</button>
        <button class="operator" data-op="*">×</button>

        <button data-number="4">4</button>
        <button data-number="5">5</button>
        <button data-number="6">6</button>
        <button class="operator" data-op="-">−</button>

        <button data-number="1">1</button>
        <button data-number="2">2</button>
        <button data-number="3">3</button>
        <button class="operator" data-op="+">+</button>

        <button class="zero" data-number="0">0</button>
        <button data-action="decimal">.</button>
        <button class="operator" data-action="equals">=</button>
    </div>

    <div class="footer">PRECISION • ELEGANCE • INTELLIGENCE</div>
</main>

<script src="script.js"></script>
</body>
</html>
